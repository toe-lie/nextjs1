name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Install & Build Next.js
        run: |
          corepack enable
          pnpm install
          pnpm build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - name: Deploy to Server (Production)
        run: |
          rsync -avz --delete .next/standalone/ deploy@${{ secrets.DEPLOY_HOST }}:/var/www/nextjs1/.next/standalone/
          rsync -avz --delete public/ deploy@${{ secrets.DEPLOY_HOST }}:/var/www/nextjs1/public/
          rsync -avz package.json deploy@${{ secrets.DEPLOY_HOST }}:/var/www/nextjs1/

      - name: Restart PM2 (Production)
        run: ssh deploy@${{ secrets.DEPLOY_HOST }} "pm2 restart nextjs1-prod"
